<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h1>Aprendendo Javascript</h1>

    <script type="text/javascript">
       let nome = window.prompt("Digite o seu nome: ");
       if (nome) {
           window.alert("Olá " + nome + ". Entrando valores com JS. ");
       } else {
        window.alert("Você não digitou nenhum nome!");
       }

    </script>
</body>
</html>
